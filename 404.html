*,*::before,*::after{box-sizing:border-box}

.code{font-family:var(--caps);font-size:13px;letter-spacing:.32em;color:var(--bronze);margin:0 auto}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,10vw,60px);line-height:1.05;margin:12px 0 14px}
p{color:var(--muted);margin:0 auto 30px;max-width:36ch}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;font-size:15px;font-weight:500;letter-spacing:.02em;text-decoration:none;border:1px solid transparent;transition:background .35s,color .35s}
.btn-dark{background:var(--cocoa);color:var(--cream)}.btn-dark:hover{background:var(--bronze)}
.btn-line{border-color:rgba(63,49,41,.35);color:var(--cocoa)}.btn-line:hover{background:var(--cocoa);color:var(--cream)}
.contact{margin-top:34px;font-size:14px;color:var(--muted)}
.contact a{color:var(--bronze);text-underline-offset:4px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
@keyframes in{to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){main,.lash path{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>
